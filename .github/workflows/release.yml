# Build OptScaler(NR) and attach the user zip to a GitHub Release.
#
# Source default is 3 NR slots (AmdSlots); AMD_SINGLESLOT only moves it to 1.
# Ordinary Release is the shipping configuration — do not add diagnostics.
#
# Does NOT package NVIDIA DLLs, NR weights, or the author's pass DLL.
#
# Dependencies (FFX / XeSS signed bins) come from the git submodules under
# external/. `submodules: recursive` below is what puts them in the workspace —
# they are *.dll, so they are deliberately not committed directly.
#
# Link inputs (freetype.lib, FSR2/FSR31 static libs, vulkan-1.lib, detours.lib)
# live under OptiScaler/library and external/freetype. They are tracked in git
# the same way upstream OptiScaler does (git add -f despite *.lib ignore).
#
# Runner: windows-latest. The benchmarked binaries were built with the v145
# toolset (VS 2026), so we pin PLATFORM_TOOLSET to match rather than letting the
# project's v143 fallback pick a different compiler than the one we benchmarked.
# The preflight step fails loudly if the image no longer ships v145.

name: release

on:
  push:
    tags:
      - 'v*'
  # Manual runs execute full regression only; publishing needs one tag run.
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORM_TOOLSET: v145
  # The MSVC toolchain the measured binaries were built with. The preflight picks
  # the exact installed 14.44.35207 and the build pins VCToolsVersion to it, so CI
  # produces the same compiler as the local build instead of whatever the image
  # happens to default to.
  MSVC_PREFIX: '14.44'
  MSVC_VERSION: '14.44.35207'
  WINDOWS_SDK_VERSION: '10.0.26100.0'
  BUILD_OUT: exports/release-ci

jobs:
  build:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($v -notmatch '^[0-9A-Za-z._-]+$') { throw 'Invalid committed VERSION' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$v") { throw 'Tag must match committed VERSION' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Prepare release notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = @'
          ### v1.12.1

          1.12.1 正式版：汇总自 v1.11.0 正式版以来的全部改动，包含 1.12.0-alpha、1.12.0-alpha2 的预发布内容。

          - **实验性：同命令列表原地内联执行架构（NrInline 模式）**：
            - 为《红色沙漠》（Crimson Desert）等当前无法进行帧切分的游戏特别修复，待实机测试；内联模式帧数待优化，请尝试内联菜单内多处实验性开关比较使用。
          - **Mochizuki 官方 0.0.5-win-preview 深度集成与 ACO 编译器支持**，保留本项目 Windows 游戏兼容处理：
            - 修复 ACO 解码器尾部（C64 到 fused-C32）屏障依赖与生命周期边界（感谢 @[Overclockers](https://github.com/TheAutomatic/dlss-5-amd-project/commits?author=Overclockers)）。
            - 支持可选 30 层降噪模式与 SR 后 NR 运动矢量直通。
            - Ins 菜单新增 INT4 mixed 与 RenoDX 画面选项，**均未默认开启**。INT4 开关位于 ACO 开关正下方。Ctrl+F11 切换默认网络和 INT4 请求，不改变独立 ACO 设置；INT4 只在 ACO 实际可用时启用。
            - RenoDX 使用自身白点/曝光与画面处理，原模式的设置保留。人物保护在 RenoDX 下禁用；预处理继续在 RenoDX 阶段执行。
          - **《极限竞速：地平线 6》（Forza Horizon 6）兼容**：
            - 保留录制代理并规范增强屏障输入（感谢 @[Overclockers](https://github.com/TheAutomatic/dlss-5-amd-project/commits?author=Overclockers)，PR [#8](https://github.com/TheAutomatic/dlss-5-amd-project/pull/8)）。
            - 进程名含 `forza` 时自动开启「早期包装所有模块」（`LmxxfEarlyAnyModuleWrap`，需重启生效）与「允许增强屏障」（`LmxxfAllowEnhancedBarriers`，即时生效），二者均可在菜单强制开/关；地平线不使用内联模式（感谢 B 站 [清明yyyyy](https://space.bilibili.com/651151676) ）。
          - **《最终幻想 VII 重生》画面修复**：游戏中途切换颜色格式时自动转换，避免画面异常；格式不变的游戏不受影响。（感谢 B 站 [清明yyyyy](https://space.bilibili.com/651151676) ）
          - **Mochizuki 后端接入本项目 lmxxf 后端的曝光与白点功能**（感谢 @[Ciaranoff](https://github.com/TheAutomatic/dlss-5-amd-project/commits?author=Ciaranoff)，PR [#9](https://github.com/TheAutomatic/dlss-5-amd-project/pull/9)）：
            - 新增「白点来源」下拉：关闭 / 跟随游戏 / 自行测光 / 自动，默认关闭（INI `MochizukiWhitePointSource`）。
            - 「白点/微调」滑块与之并列显示在 Mochizuki 输入页；选择自动来源时它是在自动结果上的亮度微调，1.0 为不调整。
          - **Mochizuki 其他改动**：ACO 快速模式默认开启（已有 INI 中的 `MochizukiAcoMode=false` 不会被迁移）；安装时只提取权重；内联模式支持 FP16 输入，符合条件的内联链在计算队列上运行。
          - **菜单**：Mochizuki 预处理开启且为多层模式时，在人物保护处提示其不会生效；隐藏 AMD 后端不使用的 NGX 全局白点设置；标题栏与启动画面显示免费软件声明。
          - **审查修复与发布加固**：补入 LICENSE / NOTICE 与 lmxxf MIT 许可；可写 ACO 驱动缓存迁至 `LOCALAPPDATA`；内联录制完成确认与资源回收。
          - 提供内联诊断与实验开关（`NrFrameDiag`、`NrGpuHandoff`、`NrInlineReuse`、`NrCaptureBackoff`）。
          - **架构稳定性与自动化测试回归**。

          **安装与对应后端权重准备**

          - 请完整解压 ZIP 至任意文件夹并运行新包的 `Setup.bat`。更新时推荐选择 **Y 先卸载**，重新使用包内默认配置（已自带人物模型保留规则）。
          - **Daniel 0.6.0**：运行文件请前往 [Daniel 官方发布页](https://github.com/danielblnc/DLSS-NR-on-AMD/releases) 获取；`nvngx_dlssnr.dll` 310.8.0 请自行获取。
          - **lmxxf 0.41**：请从合法持有且许可允许使用的模型文件自行准备 `native-game-tiled-assets` 权重目录，提取方法见 [原仓库](https://github.com/lmxxf/dlss5-on-amd-9070xt-porting)。
          - **Mochizuki 0.0.5（基于官方 0.0.5-win-preview）**：从 `nvngx_dlssnr.dll` 310.8.0（与 Daniel 使用同一文件）提取权重，需要 Python 3.10+。
          - 本包已内置 PP-HumanSeg、YOLO11n-seg 人物分割模型与 YuNet 人脸模型权重（见 Licenses/）；不含 NVIDIA DLL、Daniel 安装器或全图专有神经渲染权重。

          **已知问题**

          - 实验性内联模式（`NrInline`）目前需在配置中显式开启，专用于解决不兼容命令列表拆分的游戏；在已兼容切分模式的游戏中建议保持默认。有限自旋预算不保证跨队列进度或帧时间上界；超时/中止路径的输入同步风险仍待解决。
          - SR → NR 支持 DX12 及 DX11/Vulkan 转 DX12 桥接，不扩展原生 RR/Vulkan；不支持的纹理布局保留 SR 图像并显示原因。
          - lmxxf 时序历史（抗闪烁）功能与 ViT 自适应复用继续互斥；建议关闭预测第 3 层。
          - 部分场景与 XeFG 插件冲突，请关闭 XeFG 后重新进入游戏。

          感谢各位用户的测试与反馈。

          ---

          ### v1.12.1

          Stable 1.12.1: all changes since v1.11.0, including the 1.12.0-alpha and 1.12.0-alpha2 previews.

          - **Experimental: Same-Command-List Inline NR Execution (`NrInline` Mode)**:
            - A dedicated fix for games that currently cannot use frame splitting, such as *Crimson Desert*; pending in-game testing. Inline frame rate still needs optimization; please try the experimental switches in the Inline menu and compare.
          - **Mochizuki Official 0.0.5-win-preview Integration & ACO Compiler Support**, preserving this project's Windows game compatibility:
            - Fixed ACO decoder-tail (C64 to fused-C32) barrier dependencies and lifetime boundaries (special thanks to @[Overclockers](https://github.com/TheAutomatic/dlss-5-amd-project/commits?author=Overclockers)).
            - Added selectable 30-layer pass mode and post-SR NR motion vector passthrough.
            - Add optional INT4 mixed and RenoDX picture controls to Ins, **both off by default**. The INT4 switch sits directly below ACO. Ctrl+F11 switches the default/INT4 request without changing ACO. INT4 requires effective ACO.
            - RenoDX owns its white-point/exposure and picture processing while preserving native settings. Person protection is disabled in RenoDX; preprocessing remains active inside its stage.
          - **Forza Horizon 6 compatibility**:
            - Recording proxies are preserved and enhanced-barrier inputs normalized (thanks to @[Overclockers](https://github.com/TheAutomatic/dlss-5-amd-project/commits?author=Overclockers), PR [#8](https://github.com/TheAutomatic/dlss-5-amd-project/pull/8)).
            - For executables whose name contains `forza`, early wrap of all modules (`LmxxfEarlyAnyModuleWrap`, restart required) and Allow enhanced barriers (`LmxxfAllowEnhancedBarriers`, applies live) turn on automatically; both can be forced on/off in the menu. Forza does not use inline mode (thanks to [清明yyyyy](https://space.bilibili.com/651151676) on Bilibili).
          - **Final Fantasy VII Rebirth image fix**: when the game switches colour format mid-session, NR now converts it automatically to avoid a broken image; games that keep one format are unaffected (thanks to [清明yyyyy](https://space.bilibili.com/651151676) on Bilibili).
          - **Mochizuki now uses this project's lmxxf backend exposure and white-point controls** (thanks to @[Ciaranoff](https://github.com/TheAutomatic/dlss-5-amd-project/commits?author=Ciaranoff), PR [#9](https://github.com/TheAutomatic/dlss-5-amd-project/pull/9)):
            - New "White point source" dropdown: Off / Follow game / Own meter / Auto, default Off (INI `MochizukiWhitePointSource`).
            - The "White point / brightness trim" slider now sits next to it on the Mochizuki input page; with an auto source it is a brightness trim on the automatic result, 1.0 = no change.
          - **Other Mochizuki changes**: ACO fast mode is on by default (existing INIs with `MochizukiAcoMode=false` are not migrated); installation extracts only the weights; inline mode accepts FP16 input and eligible inline chains run on the compute queue.
          - **Menu**: a warning under Person protection when Mochizuki preprocessing is on in multi-pass mode (protection does not apply); NGX-only global white point settings, unused by AMD backends, are hidden; the title bar and splash show a free-software notice.
          - **Review fixes and release hardening**: LICENSE / NOTICE and the lmxxf MIT licence are included; the writable ACO driver cache moved to `LOCALAPPDATA`; inline recording completion tracking and resource reclamation.
          - Inline diagnostics and experimental switches (`NrFrameDiag`, `NrGpuHandoff`, `NrInlineReuse`, `NrCaptureBackoff`).
          - **Architectural Stability & Automated Test Coverage**.

          **Installation and backend model preparation**

          - Extract the complete ZIP into a folder of your choice and run `Setup.bat`. When updating, we recommend choosing **Y to uninstall first** and start with default settings (existing person models are preserved automatically).
          - **Daniel 0.6.0**: obtain runtime files from the [Daniel releases page](https://github.com/danielblnc/DLSS-NR-on-AMD/releases). Obtain `nvngx_dlssnr.dll` 310.8.0 separately.
          - **lmxxf 0.41**: prepare `native-game-tiled-assets` from model files you lawfully possess and are permitted to use; extraction instructions are in the [upstream repository](https://github.com/lmxxf/dlss5-on-amd-9070xt-porting).
          - **Mochizuki 0.0.5 (based on official 0.0.5-win-preview)**: extract weights from `nvngx_dlssnr.dll` 310.8.0 (same file as Daniel). Python 3.10+ is required.
          - Bundles PP-HumanSeg and YOLO11n-seg person segmentation models and the YuNet face model (see Licenses/); NVIDIA DLLs, Daniel installers, and proprietary neural weights are not included.

          **Known issues**

          - Experimental `NrInline` mode must be explicitly enabled in configuration; intended specifically for games with split-ineligible command lists. Keep default split mode for normally compatible titles. Bounded spinning does not guarantee cross-queue progress or a frame-time limit; input synchronization risks on timeout/abort remain unresolved.
          - SR → NR supports DX12 and DX11/Vulkan-to-DX12 bridges; does not provide native RR/Vulkan. Unsupported layouts retain the SR frame and display diagnostic reasons.
          - lmxxf temporal history and adaptive ViT reuse remain mutually exclusive. Disabling predicted pass 3 is recommended.
          - May conflict with the XeFG plugin in certain titles; disable XeFG and restart the game if encountered.

          Thanks to all users for testing and feedback.

          This archive does not include NVIDIA proprietary binaries, the danielblnc installer, or unauthorized model weights.

          See the included README for configuration details. Bug reports with logs are welcome.
          '@
          if ([string]::IsNullOrWhiteSpace($body)) { throw 'Empty release notes' }
          $headings = [regex]::Matches($body, '(?m)^### v([^\s]+)\s*$')
          if (!$headings.Count) { throw "Missing release notes version heading" }
          foreach ($heading in $headings) {
            if ($heading.Groups[1].Value -cne $env:RELEASE_VERSION) { throw "Release notes version mismatch" }
          }
          $body += "`nSource / 源码：[$env:SOURCE_SHA](https://github.com/$env:SOURCE_REPO/tree/$env:SOURCE_SHA)`n"
          New-Item -ItemType Directory -Force exports | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'exports/release-notes.md'), $body, [Text.UTF8Encoding]::new($false))

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reject moved published tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -B .github/scripts/publish_release_asset.py --tag "$env:RELEASE_TAG" --verify-source "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Toolchain preflight
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Write-Host "Visual Studio: $vs"

          # Do NOT probe ...\MSBuild\Microsoft\VC\v*\...\PlatformToolsets by name.
          # That tree exists once per VS generation, each holds a different subset,
          # and picking one shows a misleading list: on the VS2026 image the first
          # match lists only v142 (pulled in for UWP), which reads as "v145 absent"
          # when it is in fact installed. MSVC's own directory is unambiguous.
          $msvcRoot = Join-Path $vs 'VC\Tools\MSVC'
          if (!(Test-Path $msvcRoot)) { throw "No MSVC toolchain directory at $msvcRoot" }
          $have = @(Get-ChildItem -LiteralPath $msvcRoot -Directory |
            Select-Object -ExpandProperty Name | Sort-Object)
          Write-Host "MSVC toolchains: $($have -join ', ')"
          # 14.44 is the toolchain the benchmarked binaries were built with.
          $pick = $have | Where-Object { $_ -eq $env:MSVC_VERSION } | Select-Object -First 1
          if (-not $pick) {
            throw "No MSVC $env:MSVC_VERSION toolchain on this image (have: $($have -join ', '))."
          }
          Write-Host "Using MSVC $pick (PlatformToolset=$env:PLATFORM_TOOLSET)"
          "msvc=$pick" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $deps = @(
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/xess/bin/libxess.dll',
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/FidelityFX-SDK-v2/Kits/FidelityFX/signedbin/amd_fidelityfx_upscaler_dx12.dll'
          )
          foreach ($d in $deps) {
            if (!(Test-Path $d)) { throw "Submodule content missing: $d (did checkout fetch submodules?)" }
          }
          Write-Host 'Submodule dependencies present.'

      - name: Link-library preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same as upstream OptiScaler: these *.lib are tracked despite
          # .gitignore (git add -f). They are not in the FFX/XeSS submodules.
          $libRoot = 'OptiScaler-DLSSNR-PreSR-Multipass-main/OptiScaler/library'
          $required = @(
            "$libRoot/fsr2/ffx_fsr2_api_x64.lib",
            "$libRoot/vulkan/vulkan-1.lib",
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/freetype/freetype.lib'
          )
          $missing = @($required | Where-Object { !(Test-Path $_) })
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "MISSING $_" }
            throw 'Link libraries missing from checkout. They must be in git (git add -f).'
          }
          Write-Host 'Link libraries present.'

      - name: MSVC dev environment
        # setup-msbuild only puts MSBuild on PATH — it deliberately does NOT add
        # cl.exe. This action runs vcvarsall so `cl` below resolves.
        # Maintained fork of ilammy/msvc-dev-cmd; the upstream one is still on
        # node20 and GitHub force-runs it on node24 with a deprecation warning.
        # Every action below is pinned to a node24 release for the same reason.
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
          toolset: ${{ steps.toolchain.outputs.msvc }}
          sdk: ${{ env.WINDOWS_SDK_VERSION }}

      - name: Verify compiler environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VCToolsVersion.TrimEnd('\') -ne $env:MSVC_VERSION) { throw "Unexpected compiler: $env:VCToolsVersion" }
          if ($env:WindowsSDKVersion.TrimEnd('\') -ne $env:WINDOWS_SDK_VERSION) { throw "Unexpected SDK: $env:WindowsSDKVersion" }
          Write-Host "Runtime/tests/host: MSVC=$env:VCToolsVersion SDK=$env:WindowsSDKVersion"
          Get-Command cl.exe | Select-Object -ExpandProperty Source

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Module contract gate
        shell: pwsh
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/release/check-module-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compute build cache key
        id: cache_keys
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mochi = python -B tools/build/mochizuki-manifest.py --cache-key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "mochi=$mochi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore verified Mochizuki build
        uses: actions/cache@v5
        with:
          path: |
            exports/mochizuki-runtime/MochizukiNrRuntime.dll
            exports/mochizuki-runtime/build-manifest.json
            exports/mochizuki-runtime/dlssnr-amd/shaders
            exports/mochizuki-runtime/dlssnr-amd/aco
            exports/mochizuki-runtime/dlssnr-amd/int4/settings.txt
            exports/mochizuki-runtime/dlssnr-amd/int4/shaders
            exports/mochizuki-runtime/dlssnr-amd/int4/vit
            exports/mochizuki-runtime/dlssnr-amd/int4/swin
            exports/mochizuki-runtime/model-tools
          key: mochi-${{ runner.os }}-${{ steps.cache_keys.outputs.mochi }}

      - name: Build or verify Mochizuki
        shell: pwsh
        run: |
          cmd /d /c tools\build\build-mochizuki-runtime.cmd --reuse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build host and run release checks concurrently
        timeout-minutes: 25
        shell: pwsh
        run: |
          ./tools/build/build-ci.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create ephemeral package signing certificate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/release/package-signing.ps1
          $cert = Get-PackageSigningCertificate -Ephemeral
          "PACKAGE_SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore public person assets
        uses: actions/cache@v5
        with:
          path: |
            assets/person-model/onnxruntime.dll
            assets/person-model/pphumanseg.onnx
            assets/person-model/yolo11n-seg.onnx
            assets/person-model/yunet.onnx
          key: person-assets-${{ runner.os }}-py312-${{ hashFiles('tools/release/prepare-person-assets.ps1') }}

      - name: Prepare person assets (CRT refreshed each run)
        shell: pwsh
        run: |
          ./tools/release/prepare-person-assets.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package user zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.version }}'
          powershell -ExecutionPolicy Bypass -File tools\release\PACKAGE_RELEASE.ps1 `
            -Version $ver `
            -OptiDll "$env:BUILD_OUT\OptiScaler.dll" `
            -SigningThumbprint "$env:PACKAGE_SIGNING_THUMBPRINT" `
            -OutDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist\OptScaler-NR-$ver.zip")) {
            throw "Package zip missing for $ver"
          }

      - name: Remove ephemeral signing key
        if: ${{ always() && env.PACKAGE_SIGNING_THUMBPRINT != '' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PACKAGE_SIGNING_THUMBPRINT -notmatch '^[0-9a-fA-F]{40}$') { throw 'Invalid ephemeral certificate identity' }
          Import-Module (Join-Path $PSHOME 'Modules/Microsoft.PowerShell.Security/Microsoft.PowerShell.Security.psd1')
          Get-Item -LiteralPath "Cert:/CurrentUser/My/$env:PACKAGE_SIGNING_THUMBPRINT" -ErrorAction Stop | Out-Null
          Remove-Item -LiteralPath "Cert:/CurrentUser/My/$env:PACKAGE_SIGNING_THUMBPRINT" -DeleteKey -ErrorAction Stop

      - name: Guard against proprietary files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Independent CI tripwire: inspect the exact archive that Release uploads.
          $ver = '${{ steps.ver.outputs.version }}'
          $zipPath = "dist\OptScaler-NR-$ver.zip"
          $forbidden = '(?i)^(nvngx.*\.dll|dlssnr_amd_pass.*\.dll|dlssnr_on_amd_weights\.bin|dlssnr(?:-int4)?\.bin|pipeline\.cache|version\.dll|dlssnr_on_amd_setup\.exe)$'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zipPath))
          try {
            $bad = @($archive.Entries |
              Where-Object { -not [string]::IsNullOrEmpty($_.Name) -and $_.Name -match $forbidden } |
              ForEach-Object { $_.FullName })
            $entryNames = @($archive.Entries | ForEach-Object { $_.Name })
            $entryPaths = @($archive.Entries | ForEach-Object { $_.FullName.Replace("\", "/") })
          } finally {
            $archive.Dispose()
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "FORBIDDEN: $_" }
            throw 'Refusing to publish: proprietary/user-supplied binaries found in package zip.'
          }
          $required = @('OptiScaler.dll', 'LmxxfNrRuntime.dll', 'MochizukiNrRuntime.dll', 'OptiScaler.ini', 'Setup.ps1', 'Setup.bat', 'LICENSE', 'NOTICE', 'person-worker.exe', 'onnxruntime.dll', 'pphumanseg.onnx', 'yolo11n-seg.onnx', 'yunet.onnx')
          foreach ($r in $required) {
            if ($entryNames -notcontains $r) {
              throw "REQUIRED COMPONENT MISSING IN ZIP: $r"
            }
          }

          foreach ($path in @('model-tools/dlssnr-int4-weights.exe', 'model-tools/dlssnr-int4.sha256', 'mochizuki-int4.ps1') +
              @(Get-Content tools/install/mochizuki-owned.txt | Where-Object { $_ -and !($_.StartsWith('#')) } | ForEach-Object { "dlssnr-amd/$_" })) {
            if ($entryPaths -notcontains $path) { throw "REQUIRED MOCHIZUKI COMPONENT MISSING: $path" }
          }
          if ($entryPaths -match '(?i)/(aco-cache|pipeline-binaries)/') { throw 'Driver cache included in package.' }
          foreach ($license in @('OptiScaler_LICENSE.txt', 'Lmxxf_MIT.txt', 'Mochizuki_MIT.txt', 'RenoDX_MIT.txt', 'ONNXRuntime_MIT.txt', 'YOLO11_AGPL-3.0.txt', 'PPHumanSeg_Apache-2.0.txt', 'YuNet_MIT.txt', 'XeSS_LICENSE.txt', 'FidelityFX_v1_LICENSE.md', 'FidelityFX_v2_LICENSE.md', 'DirectX_LICENSE.txt')) {
            if ($entryPaths -notcontains "Licenses/$license") {
              throw "REQUIRED LICENSE MISSING IN ZIP: $license"
            }
          }

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-logs
          path: |
            exports/release-ci/*.log
            exports/release-ci/tests/summary.txt
          if-no-files-found: ignore

      - name: Create GitHub Release metadata
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # Pre-release when tag name has an -alpha/-beta/-rc suffix (e.g. v1.9.1-alpha).
          # Formal tags like v1.9.1 stay latest/stable; plain substrings such as "source" do not count.
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body_path: exports/release-notes.md

      - name: Upload release asset with verified retries
        if: startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 20
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python -B .github/scripts/publish_release_asset.py --tag "$env:RELEASE_TAG" --asset "dist/OptScaler-NR-$env:RELEASE_VERSION.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up pinned compiler
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
          toolset: ${{ env.MSVC_VERSION }}
          sdk: ${{ env.WINDOWS_SDK_VERSION }}
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Build and run full regression
        shell: pwsh
        run: |
          cmd /d /c tools\build\build-mochizuki-runtime.cmd --reuse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/build/build-ci.ps1 -FullRegression
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay Mochizuki upstream pin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content tools/mochizuki-sync/manifest.json -Raw | ConvertFrom-Json).commit
          $upstream = Join-Path $env:RUNNER_TEMP 'mochizuki-source-check'
          git init $upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $upstream fetch --depth=1 https://github.com/mochizuki0323/DLSSNR-AMD.git $pin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/mochizuki-sync/check.py --upstream $upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-logs
          path: |
            exports/release-ci/*.log
            exports/release-ci/tests/summary.txt
          if-no-files-found: ignore
